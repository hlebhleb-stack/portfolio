name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The image job commits back to main, so two runs must never overlap. Queued
# rather than cancelled: cancelling could kill a run between its commit and its
# push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Report bundle size
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -sh dist/build/* >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          TOTAL=$(du -sh dist | cut -f1)
          echo "**Total dist size:** $TOTAL" >> $GITHUB_STEP_SUMMARY

  optimize-images:
    name: Optimize Images
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: write
    defaults:
      run:
        working-directory: client
    steps:
      # Two commits is enough to diff this push against its parent, which is
      # all the "what changed" step needs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find images changed in this push
        id: changed
        working-directory: .
        run: |
          BEFORE="${{ github.event.before }}"
          # All-zero before means a new branch or a force push, where there is
          # no usable parent to diff against — fall back to checking everything.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No usable parent commit; will check every image."
            echo "files=ALL" >> $GITHUB_OUTPUT
            exit 0
          fi
          FILES=$(git diff --name-only --diff-filter=ACMR "$BEFORE" "${{ github.sha }}" \
                  -- 'client/public/assets/**' \
                  | grep -Ei '\.(png|jpe?g)$' \
                  | sed 's|^client/||' \
                  | tr '\n' ' ')
          if [ -z "$FILES" ]; then
            echo "No images changed in this push."
            echo "files=" >> $GITHUB_OUTPUT
          else
            echo "Changed: $FILES"
            echo "files=$FILES" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.changed.outputs.files != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        if: steps.changed.outputs.files != ''
        run: npm ci

      - name: Optimize
        if: steps.changed.outputs.files != ''
        run: |
          if [ "${{ steps.changed.outputs.files }}" = "ALL" ]; then
            node scripts/optimize-images.mjs
          else
            node scripts/optimize-images.mjs ${{ steps.changed.outputs.files }}
          fi

      - name: Commit optimized images
        if: steps.changed.outputs.files != ''
        working-directory: .
        run: |
          # Scoped to the asset folder on purpose: this job has write access to
          # the default branch, and `git add -A` would hand it anything else
          # that happened to be dirty in the runner.
          git add -- client/public/assets
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: optimize images [skip ci]"
          # Not `|| true`: a failed push means the optimization is silently
          # lost, and the run should say so rather than report success.
          git push
